<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Water Point</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/pages.css') }}">

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <div class="site-title">
            Village Water Point Monitoring
        </div>


        <nav class="site-nav">

            <a href="{{ url_for('index') }}">
                Dashboard
            </a>

            <a href="{{ url_for('listing') }}">
                Water Points
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

            <a href="{{ url_for('simulation') }}">
                Control Simulation
            </a>

        </nav>

    </div>

</header>


<main class="page-container">


    <section class="page-introduction">

        <h2>
            Register Water Point
        </h2>

        <p>
            Add a new village water point to the
            monitoring system.
        </p>

    </section>


    <section class="form-card">

        <h2>
            Water Point Details
        </h2>


        {% if error %}

        <div class="result-message">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <div class="form-group">

                <label for="name">
                    Water Point Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter water point name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter village or location"
                    required
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Current Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option value="">
                        Select Status
                    </option>

                    <option value="Working">
                        Working
                    </option>

                    <option value="Not Working">
                        Not Working
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="uptime">
                    Uptime Percentage
                </label>

                <input
                    type="number"
                    id="uptime"
                    name="uptime"
                    value="0"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="last_checked">
                    Last Checked
                </label>

                <input
                    type="datetime-local"
                    id="last_checked"
                    name="last_checked"
                >

            </div>


            <div class="button-area">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Save Water Point
                </button>


                <a
                    href="{{ url_for('index') }}"
                    class="secondary-button"
                >
                    Cancel
                </a>

            </div>


        </form>

    </section>

</main>


<footer class="site-footer">

    <p>
        © 2026 Village Water Point Monitoring System
    </p>

</footer>


<script src="{{ url_for('static', filename='js/script.js') }}">
</script>


</body>

</html>
